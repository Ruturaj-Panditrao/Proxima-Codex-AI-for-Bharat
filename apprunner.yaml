version: 1.0
runtime: python311

build:
  commands:
    build:
      - cd stream
      - python -m pip install --upgrade pip
      - python -m pip install -r requirements.txt

run:
  runtime-version: 3.11
  command: cd stream && python -m uvicorn app:app --host 0.0.0.0 --port 8080
  network:
    port: 8080